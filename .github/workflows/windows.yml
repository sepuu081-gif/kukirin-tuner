name: Build Windows game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run desktop:build
      - name: Package portable Windows app
        shell: pwsh
        run: Compress-Archive -LiteralPath 'desktop-release/KuKirin Tuner-win32-x64' -DestinationPath 'KuKirin-Tuner-Windows.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: KuKirin-Tuner-Windows
          path: KuKirin-Tuner-Windows.zip
      - name: Publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "windows-${{ github.run_number }}" 'KuKirin-Tuner-Windows.zip' --target '${{ github.sha }}' --title 'KuKirin Tuner v73 - Windows' --notes 'Unique online rider names with private account keys. Custom powertrain limit is 20,000 W for regular accounts; only the verified Zepu owner account has higher custom power. Existing garage and career saves are preserved. No new Android APK is included.'
