name: Build Windows game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run desktop:build
      - name: Package portable Windows app
        shell: pwsh
        run: Compress-Archive -LiteralPath 'desktop-release/KuKirin Tuner-win32-x64' -DestinationPath 'KuKirin-Tuner-Windows.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: KuKirin-Tuner-Windows
          path: KuKirin-Tuner-Windows.zip
      - name: Assemble original Android APK
        shell: pwsh
        run: python -c "from pathlib import Path; import hashlib; p=Path('downloads'); data=(p/'KuKirin-Tuner-v64.apk.part1').read_bytes()+(p/'KuKirin-Tuner-v64.apk.part2').read_bytes(); assert hashlib.sha256(data).hexdigest()==(p/'KuKirin-Tuner-v64.apk.sha256').read_text().strip(); (p/'KuKirin-Tuner-v64.apk').write_bytes(data)"
      - name: Publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "windows-${{ github.run_number }}" 'KuKirin-Tuner-Windows.zip' 'downloads/KuKirin-Tuner-v64.apk' --target '${{ github.sha }}' --title 'KuKirin Tuner v64 - Android and Windows' --notes 'Tester visual fixes: real S3 Pro, seated C1 Pro, Dualtron Eagle Pro, Thunder and Kaabo Wolf Warrior 11 photos. G2 Max Custom 52V correctly labelled; Red Bull G2 livery restored. Android: install KuKirin-Tuner-v64.apk over your existing app. Windows: extract the ZIP and launch KuKirin Tuner.exe. W = throttle, S = rear brake, Space = wheelie. Optional Start.io production video playback remains unverified.'
