name: Build Windows game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: windows-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: node scripts/check-desktop-updater.cjs
      - run: npm run desktop:build
      - uses: actions/upload-artifact@v4
        with:
          name: KuKirin-Tuner-Windows-EXE
          path: |
            desktop-release/setup/*.exe
            desktop-release/setup/*.blockmap
            desktop-release/setup/latest.yml
      - name: Publish installer and complete updater feed
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $version = node -p "require('./package.json').version"
          $tag = "v$version"
          gh release create $tag --draft --target $env:GITHUB_SHA --title "KuKirin Tuner $version - Windows EXE" --notes-file desktop/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'Release creation failed. Increase package.json version for each release.' }
          $assets = @(Get-ChildItem -LiteralPath desktop-release/setup -File | Where-Object { $_.Name -like '*.exe' -or $_.Name -like '*.blockmap' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName })
          gh release upload $tag @assets
          if ($LASTEXITCODE -ne 0) { throw 'Release upload failed; draft remains unpublished.' }
          gh release edit $tag --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed.' }
