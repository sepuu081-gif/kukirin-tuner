name: Build Windows game
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run desktop:build
      - name: Package portable Windows app
        shell: pwsh
        run: Compress-Archive -LiteralPath 'desktop-release/KuKirin Tuner-win32-x64' -DestinationPath 'KuKirin-Tuner-Windows.zip'
      - uses: actions/upload-artifact@v4
        with:
          name: KuKirin-Tuner-Windows
          path: KuKirin-Tuner-Windows.zip
      - name: Assemble original Android APK
        shell: pwsh
        run: python -c "from pathlib import Path; import hashlib; p=Path('downloads'); data=(p/'KuKirin-Tuner-v63.apk.part1').read_bytes()+(p/'KuKirin-Tuner-v63.apk.part2').read_bytes(); assert hashlib.sha256(data).hexdigest()==(p/'KuKirin-Tuner-v63.apk.sha256').read_text().strip(); (p/'KuKirin-Tuner-v63.apk').write_bytes(data)"
      - name: Publish download
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release create "windows-${{ github.run_number }}" 'KuKirin-Tuner-Windows.zip' 'downloads/KuKirin-Tuner-v63.apk' --target '${{ github.sha }}' --title 'KuKirin Tuner v63 - Android and Windows' --notes 'Android: install KuKirin-Tuner-v63.apk. Profile has optional Start.io rewarded videos (+500 REP). Production video playback remains unverified. Windows: portable 64-bit app. Extract the ZIP and launch KuKirin Tuner.exe. W = throttle, S = rear brake, Space = wheelie, F11 = fullscreen. Offline riding supported.'



